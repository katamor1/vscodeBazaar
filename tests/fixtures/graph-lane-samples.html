<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Bazaar graph lane samples</title>
  <style>
    body {
      margin: 24px;
      color: #1f2328;
      background: #f6f8fa;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
    }
    .samples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 16px;
    }
    .sample {
      border: 1px solid #d0d7de;
      background: #ffffff;
      padding: 12px;
    }
    .sample h2 {
      margin: 0 0 8px;
      font-size: 14px;
    }
    .graph-wrap {
      overflow: auto;
      border: 1px solid #d0d7de;
      background: #ffffff;
    }
    svg {
      display: block;
      min-width: 100%;
    }
    text {
      font-size: 12px;
      dominant-baseline: middle;
    }
    .graph-edge {
      stroke: #57606a;
      stroke-width: 1.4;
      fill: none;
    }
    .graph-node circle {
      fill: #0969da;
    }
    .graph-label {
      fill: #1f2328;
    }
    .graph-label-meta {
      fill: #57606a;
    }
  </style>
</head>
<body>
  <h1>Bazaar graph lane samples</h1>
  <div class="samples" id="samples"></div>
  <script>
    const samples = [2, 3, 4, 5];
    const rowHeight = 42;
    const columnWidth = 42;
    const radius = 7;

    document.getElementById('samples').innerHTML = samples.map((laneCount) => {
      return '<section class="sample">' +
        '<h2>' + laneCount + ' lanes</h2>' +
        '<div class="graph-wrap">' + renderGraph(laneCount) + '</div>' +
      '</section>';
    }).join('');

    function renderGraph(laneCount) {
      const maxLane = laneCount - 1;
      const graphLaneWidth = Math.max(190, 48 + maxLane * columnWidth);
      const labelLaneX = graphLaneWidth + 24;
      const width = Math.max(720, labelLaneX + 520);
      const height = Math.max(160, laneCount * rowHeight + 40);
      const nodes = Array.from({ length: laneCount }, (_, index) => ({
        id: 'lane-' + (index + 1),
        x: 24 + index * columnWidth,
        y: 24 + index * rowHeight,
        label: (index + 1) + ' sample branch ' + (index + 1),
        meta: '26/05/15 00:03 / User ' + (index + 1) + ' / branch-' + (index + 1)
      }));
      const edges = nodes.slice(0, -1).map((from, index) => {
        const to = nodes[index + 1];
        const midY = from.y + Math.max(10, Math.abs(to.y - from.y) / 2);
        return '<path class="graph-edge" d="M ' + from.x + ' ' + from.y +
          ' C ' + from.x + ' ' + midY + ', ' + to.x + ' ' + midY + ', ' + to.x + ' ' + to.y + '" />';
      }).join('');
      const nodeSvg = nodes.map((node) => {
        return '<g class="graph-node" data-revision-id="' + node.id + '">' +
          '<circle cx="' + node.x + '" cy="' + node.y + '" r="' + radius + '" />' +
          '<text class="graph-label" x="' + labelLaneX + '" y="' + (node.y - 5) + '">' + node.label + '</text>' +
          '<text class="graph-label-meta" x="' + labelLaneX + '" y="' + (node.y + 11) + '">' + node.meta + '</text>' +
        '</g>';
      }).join('');
      return '<svg viewBox="0 0 ' + width + ' ' + height + '" width="' + width + '" height="' + height + '">' +
        edges +
        nodeSvg +
      '</svg>';
    }
  </script>
</body>
</html>
